name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Fetch CC0 assets (Quaternius characters + UAL2)
        run: bash tools/fetch_assets.sh

      - name: Generate recoloured character skins
        run: |
          set -e
          if python3 -c "import PIL, numpy" 2>/dev/null; then
            echo "using preinstalled pillow + numpy"
            python3 tools/gen_skins.py
          else
            echo "installing pillow + numpy in a venv"
            python3 -m venv /tmp/sk
            /tmp/sk/bin/pip install --quiet pillow numpy
            /tmp/sk/bin/python tools/gen_skins.py
          fi

      - name: Generate procedural audio (SFX + ambient + music beds)
        run: |
          set -e
          if python3 -c "import numpy" 2>/dev/null; then
            python3 tools/gen_audio.py
          else
            python3 -m venv /tmp/au
            /tmp/au/bin/pip install --quiet numpy
            /tmp/au/bin/python tools/gen_audio.py
          fi
          ls -la assets/audio | head -30

      - name: Import project
        run: godot --headless --path . --import

      - name: Regenerate level scene from code
        run: godot --headless --path . res://tools/build_level.tscn

      - name: Playtest suite
        run: godot --headless --path . res://tools/playtest.tscn

      - name: Export web build
        run: |
          mkdir -p _site/play
          touch _site/.gdignore
          godot --headless --path . --export-release "Web" "$GITHUB_WORKSPACE/_site/play/index.html"

      - name: Export desktop builds
        run: |
          mkdir -p /tmp/dist
          godot --headless --path . --export-release "Linux" "/tmp/dist/vessel_of_ash_linux.x86_64"
          godot --headless --path . --export-release "Windows Desktop" "/tmp/dist/VesselOfAsh.exe"
          chmod +x /tmp/dist/vessel_of_ash_linux.x86_64

      - name: Package downloads
        run: |
          cp docs/BUILD_README.txt /tmp/dist/README.txt
          cd /tmp/dist && zip -q -r "$GITHUB_WORKSPACE/_site/VesselOfAsh_windows.zip" VesselOfAsh.exe README.txt 2>/dev/null || zip -q -r "$GITHUB_WORKSPACE/_site/VesselOfAsh_windows.zip" VesselOfAsh.exe
          tar -czf "$GITHUB_WORKSPACE/_site/vessel_of_ash_linux.tar.gz" -C /tmp/dist vessel_of_ash_linux.x86_64

      - name: Assemble site
        run: cp -r site/. _site/

      - name: Try to enable Pages (fine if it fails - then enable it once in Settings > Pages)
        continue-on-error: true
        run: |
          set -x
          status=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' || true)
          echo "POST /pages -> $status"; head -c 400 /tmp/pages.json || true
          if [ "$status" = "409" ]; then
            curl -sS -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow"}' | head -c 400 || true
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5
          name: "Vessel of Ash — v0.5 (vertical slice)"
          body: |
            Third-person action vertical slice. Windows + Linux builds, built from source by CI.

            Play in your browser: https://${{ github.repository_owner }}.github.io/vessel-of-ash/

            - 33/33 automated gameplay checks green
            - Enemies are real KayKit skeletons: 41-bone rigs, 95 baked clips, per-class weapons
              (thrall / stalker / warden) plus a new ranged Ossuary Mage that kites and casts
            - Skeletons claw up out of the floor the first time they notice you
            - Level dressed with the KayKit dungeon kit: 4 m modular floor tiles, wall slabs with
              arched bays, balcony rails, crates, trunks, candles, loot, drifting ash
            - Sprint, lock-on target cycling, dodge/parry/heavy cancel windows, smoother camera
              with wall pull-in, gamepad look
            - ACES tonemapping, additive bloom, shadow-casting dais braziers, brighter torches
            - v0.5: original score — a crypt drone bed and a 160 bpm Choir theme that crossfades in
              when the boss wakes, plus a wind/rumble ambient layer
            - v0.5: the Choir fights back with an arena-wide slam (telegraphed by an expanding ring),
              bone volleys and skeleton summons; phase 3 is unblockable and summons stalkers too
            - v0.5: combat depth — heavy chains into a heavy finisher, sprinting + light fires a
              lunging running slash, on-screen combo counter
            - v0.5: enemies read better — wardens feint their overhead into a fast poke, mages blink
              away when crowded, the joystick rim sprints on touch
          files: |
            _site/VesselOfAsh_windows.zip
            _site/vessel_of_ash_linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
